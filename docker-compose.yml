services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook_relay
      POSTGRES_PASSWORD: webhook_relay
      POSTGRES_DB: webhook_relay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook_relay"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://webhook_relay:webhook_relay@postgres:5432/webhook_relay?sslmode=disable
      REDIS_ADDR: redis:6379
      API_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://webhook_relay:webhook_relay@postgres:5432/webhook_relay?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  asynqmon:
    image: hibiken/asynqmon:latest
    platform: linux/amd64
    command: ["--redis-addr=redis:6379"]
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
